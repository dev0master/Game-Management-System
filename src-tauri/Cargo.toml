[package]
name = "gamevault"
version = "0.1.0"
description = "Game library manager for external drives"
edition = "2021"
rust-version = "1.98"

[lib]
name = "gamevault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
blake3 = "1.8.7"
jwalk = "0.9.0"
rapidfuzz = "0.5.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "blocking", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.6", features = ["protocol-asset"] }
thiserror = "2.0.20"
unicode-normalization = "0.1.25"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
